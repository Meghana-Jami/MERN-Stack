<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <input type="number" id="userInput">
        <button onclick="callerFun()">Fetch User</button>
        <button onclick="randomUserFun()">Random User</button>
    </div>
    <div id="output"></div>
    <script>
        const fetchData=async(userInput)=>{
            const res=await fetch(`https://jsonplaceholder.typicode.com/users/${userInput}`)
            const output=document.getElementById("output")
            if(!res.ok){
                alert("Failed to fetch!")
            }
            const data=await res.json()
            // alert(`Welcome,${data.name}`)
            output.innerHTML=`<h1>${data.name}</h1>
            <h4>${data.email}</h4>`
        }
        const callerFun=()=>{
            const userInput=document.getElementById("userInput").value;
            if(!userInput){
                alert("Enter user Id!")
            }
            console.log(userInput)
            fetchData(userInput)
        }
        const randomUserFun=()=>{
            const userInput=document.getElementById("userInput");
            const randomInput=Math.round(Math.random()*10)+1;
            userInput.value=randomInput

            console.log(randomInput)
            fetchData(randomInput)
        }
    </script>
</body>
</html>
