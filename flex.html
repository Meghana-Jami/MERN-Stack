<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            display: flex;
            flex-wrap: wrap;
        }
        .box{
            display: flex;
            height: 100px;
            width: 100px;
            padding: 50px;
            background-color: azure;
            border: 2px solid black;
            justify-content: center;
            align-items: center;
            flex-direction: row;
        }
        #main1{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 20px;
        }
        .box1{
            height:100px;
            width: 100px;
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <div id="main">
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
    </div>
        <div id="main1">
        <div class="box1">box</div>
        <div class="box1">box</div>
        <div class="box1">box</div>
        <div class="box1">box</div>
    </div>
</body>
</html>
